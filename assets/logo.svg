<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%"   stop-color="#2dd4bf" stop-opacity="1.0"/>
      <stop offset="50%"  stop-color="#14b8a6" stop-opacity="1.0"/>
      <stop offset="100%" stop-color="#0d9488" stop-opacity="1.0"/>
    </linearGradient>

    <linearGradient id="gloss" x1="10%" y1="0%" x2="90%" y2="80%">
      <stop offset="0%"   stop-color="white" stop-opacity="0.7"/>
      <stop offset="40%"  stop-color="white" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="strokeGrad" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%"   stop-color="white"   stop-opacity="1.0"/>
      <stop offset="50%"  stop-color="#99f6e4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#14b8a6" stop-opacity="0.5"/>
    </linearGradient>

    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="white" stop-opacity="0.5"/>
      <stop offset="60%"  stop-color="white" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#18181b"/>
      <stop offset="100%" stop-color="#27272a"/>
    </linearGradient>

    <filter id="shadow" x="-25%" y="-15%" width="150%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="6"
                    flood-color="#09090b" flood-opacity="0.6"/>
    </filter>

    <filter id="textGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="shieldGlow" x="-15%" y="-10%" width="130%" height="130%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Glow for stars -->
    <filter id="starGlow" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer glow halo -->
  <path d="M50 7 L87 23 L87 51 C87 71 70 87 50 94 C30 87 13 71 13 51 L13 23 Z"
        fill="#5eead4" fill-opacity="0.25"
        filter="url(#shieldGlow)"
        transform="scale(1.06) translate(-3 -2)"/>

  <!-- Shield: main fill -->
  <path d="M50 7 L87 23 L87 51 C87 71 70 87 50 94 C30 87 13 71 13 51 L13 23 Z"
        fill="url(#shieldGrad)" filter="url(#shadow)"/>

  <!-- Shield: gloss -->
  <path d="M50 7 L87 23 L87 51 C87 71 70 87 50 94 C30 87 13 71 13 51 L13 23 Z"
        fill="url(#gloss)"/>

  <!-- Shield: border -->
  <path d="M50 7 L87 23 L87 51 C87 71 70 87 50 94 C30 87 13 71 13 51 L13 23 Z"
        stroke="url(#strokeGrad)" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Inner rim -->
  <path d="M50 13 L82 27 L82 51 C82 69 67 83 50 90 C33 83 18 69 18 51 L18 27 Z"
        stroke="url(#rimGrad)" stroke-width="1" stroke-linejoin="round"/>

  <!-- Gloss arc -->
  <path d="M22 35 Q50 27 78 35"
        stroke="white" stroke-opacity="0.5" stroke-width="1.5" stroke-linecap="round"/>

  <!-- DQ monogram -->
  <text x="50" y="63"
        font-family="'Helvetica Neue', Helvetica, Arial, sans-serif"
        font-size="34" font-weight="700"
        text-anchor="middle"
        fill="url(#textGrad)"
        letter-spacing="-2">DQ</text>

  <!-- Star 1: top-left (23, 30) — medium white -->
  <path d="M23,25 L24.2,28.8 L23,30 L21.8,28.8 Z M18,30 L21.8,28.8 L23,30 L21.8,31.2 Z M23,35 L24.2,31.2 L23,30 L21.8,31.2 Z M28,30 L24.2,28.8 L23,30 L24.2,31.2 Z"
        fill="white" fill-opacity="0.9" filter="url(#starGlow)"/>
  <circle cx="23" cy="30" r="1.3" fill="white"/>

  <!-- Star 2: top-right (77, 28) — small teal -->
  <path d="M77,24 L77.9,27 L77,28 L76.1,27 Z M73,28 L76.1,27 L77,28 L76.1,29 Z M77,32 L77.9,29 L77,28 L76.1,29 Z M81,28 L77.9,27 L77,28 L77.9,29 Z"
        fill="#99f6e4" fill-opacity="0.9" filter="url(#starGlow)"/>
  <circle cx="77" cy="28" r="0.9" fill="white"/>

  <!-- Star 3: right (81, 58) — medium white -->
  <path d="M81,53 L82.2,56.8 L81,58 L79.8,56.8 Z M76,58 L79.8,56.8 L81,58 L79.8,59.2 Z M81,63 L82.2,59.2 L81,58 L79.8,59.2 Z M86,58 L82.2,56.8 L81,58 L82.2,59.2 Z"
        fill="white" fill-opacity="0.85" filter="url(#starGlow)"/>
  <circle cx="81" cy="58" r="1.1" fill="white"/>

  <!-- Star 4: bottom-left (22, 68) — small teal -->
  <path d="M22,64 L22.9,67 L22,68 L21.1,67 Z M18,68 L21.1,67 L22,68 L21.1,69 Z M22,72 L22.9,69 L22,68 L21.1,69 Z M26,68 L22.9,67 L22,68 L22.9,69 Z"
        fill="#5eead4" fill-opacity="0.85" filter="url(#starGlow)"/>
  <circle cx="22" cy="68" r="0.9" fill="white"/>

  <!-- Star 5: bottom-center (50, 82) — tiny white -->
  <path d="M50,79 L50.7,81.3 L50,82 L49.3,81.3 Z M47,82 L49.3,81.3 L50,82 L49.3,82.7 Z M50,85 L50.7,82.7 L50,82 L49.3,82.7 Z M53,82 L50.7,81.3 L50,82 L50.7,82.7 Z"
        fill="#ccfbf1" fill-opacity="0.8" filter="url(#starGlow)"/>
  <circle cx="50" cy="82" r="0.7" fill="white"/>

  <!-- Star 6: top-center (50, 16) — small white -->
  <path d="M50,13 L50.8,15.5 L50,16 L49.2,15.5 Z M47,16 L49.2,15.5 L50,16 L49.2,16.5 Z M50,19 L50.8,16.5 L50,16 L49.2,16.5 Z M53,16 L50.8,15.5 L50,16 L50.8,16.5 Z"
        fill="white" fill-opacity="0.75" filter="url(#starGlow)"/>
  <circle cx="50" cy="16" r="0.8" fill="white"/>

  <!-- Star 7: left-mid (19, 48) — small teal -->
  <path d="M19,44 L19.9,47 L19,48 L18.1,47 Z M15,48 L18.1,47 L19,48 L18.1,49 Z M19,52 L19.9,49 L19,48 L18.1,49 Z M23,48 L19.9,47 L19,48 L19.9,49 Z"
        fill="#99f6e4" fill-opacity="0.8" filter="url(#starGlow)"/>
  <circle cx="19" cy="48" r="0.9" fill="white"/>

  <!-- Star 8: bottom-right (72, 76) — small white -->
  <path d="M72,73 L72.8,75.5 L72,76 L71.2,75.5 Z M69,76 L71.2,75.5 L72,76 L71.2,76.5 Z M72,79 L72.8,76.5 L72,76 L71.2,76.5 Z M75,76 L72.8,75.5 L72,76 L72.8,76.5 Z"
        fill="#ccfbf1" fill-opacity="0.8" filter="url(#starGlow)"/>
  <circle cx="72" cy="76" r="0.8" fill="white"/>

  <!-- Star 9: upper-left-mid (30, 20) — tiny -->
  <path d="M30,18 L30.5,19.5 L30,20 L29.5,19.5 Z M28,20 L29.5,19.5 L30,20 L29.5,20.5 Z M30,22 L30.5,20.5 L30,20 L29.5,20.5 Z M32,20 L30.5,19.5 L30,20 L30.5,20.5 Z"
        fill="white" fill-opacity="0.6" filter="url(#starGlow)"/>
  <circle cx="30" cy="20" r="0.6" fill="white"/>

  <!-- Star 10: upper-right-mid (70, 20) — tiny teal -->
  <path d="M70,18 L70.5,19.5 L70,20 L69.5,19.5 Z M68,20 L69.5,19.5 L70,20 L69.5,20.5 Z M70,22 L70.5,20.5 L70,20 L69.5,20.5 Z M72,20 L70.5,19.5 L70,20 L70.5,20.5 Z"
        fill="#99f6e4" fill-opacity="0.65" filter="url(#starGlow)"/>
  <circle cx="70" cy="20" r="0.6" fill="white"/>

  <!-- Star 11: left-upper (17, 35) — tiny white -->
  <path d="M17,33 L17.5,34.5 L17,35 L16.5,34.5 Z M15,35 L16.5,34.5 L17,35 L16.5,35.5 Z M17,37 L17.5,35.5 L17,35 L16.5,35.5 Z M19,35 L17.5,34.5 L17,35 L17.5,35.5 Z"
        fill="white" fill-opacity="0.55" filter="url(#starGlow)"/>
  <circle cx="17" cy="35" r="0.5" fill="white"/>

  <!-- Star 12: right-upper (83, 38) — tiny teal -->
  <path d="M83,36 L83.5,37.5 L83,38 L82.5,37.5 Z M81,38 L82.5,37.5 L83,38 L82.5,38.5 Z M83,40 L83.5,38.5 L83,38 L82.5,38.5 Z M85,38 L83.5,37.5 L83,38 L83.5,38.5 Z"
        fill="#5eead4" fill-opacity="0.6" filter="url(#starGlow)"/>
  <circle cx="83" cy="38" r="0.5" fill="white"/>

  <!-- Star 13: left-lower (16, 60) — tiny teal -->
  <path d="M16,58 L16.5,59.5 L16,60 L15.5,59.5 Z M14,60 L15.5,59.5 L16,60 L15.5,60.5 Z M16,62 L16.5,60.5 L16,60 L15.5,60.5 Z M18,60 L16.5,59.5 L16,60 L16.5,60.5 Z"
        fill="#5eead4" fill-opacity="0.6" filter="url(#starGlow)"/>
  <circle cx="16" cy="60" r="0.5" fill="white"/>

  <!-- Star 14: right-lower (84, 68) — tiny white -->
  <path d="M84,66 L84.5,67.5 L84,68 L83.5,67.5 Z M82,68 L83.5,67.5 L84,68 L83.5,68.5 Z M84,70 L84.5,68.5 L84,68 L83.5,68.5 Z M86,68 L84.5,67.5 L84,68 L84.5,68.5 Z"
        fill="white" fill-opacity="0.55" filter="url(#starGlow)"/>
  <circle cx="84" cy="68" r="0.5" fill="white"/>

  <!-- Star 15: bottom-left-low (34, 84) — tiny teal -->
  <path d="M34,82 L34.5,83.5 L34,84 L33.5,83.5 Z M32,84 L33.5,83.5 L34,84 L33.5,84.5 Z M34,86 L34.5,84.5 L34,84 L33.5,84.5 Z M36,84 L34.5,83.5 L34,84 L34.5,84.5 Z"
        fill="#99f6e4" fill-opacity="0.6" filter="url(#starGlow)"/>
  <circle cx="34" cy="84" r="0.5" fill="white"/>

  <!-- Star 16: bottom-right-low (66, 84) — tiny white -->
  <path d="M66,82 L66.5,83.5 L66,84 L65.5,83.5 Z M64,84 L65.5,83.5 L66,84 L65.5,84.5 Z M66,86 L66.5,84.5 L66,84 L65.5,84.5 Z M68,84 L66.5,83.5 L66,84 L66.5,84.5 Z"
        fill="white" fill-opacity="0.5" filter="url(#starGlow)"/>
  <circle cx="66" cy="84" r="0.5" fill="white"/>
</svg>
